<!doctype html><html lang="ko"><meta charset="utf-8"><title>유물 복원 애니메이션 검수</title><style>body{margin:0;background:#172035;color:#f4dfbd;font:16px sans-serif}main{display:flex;gap:24px;align-items:center;padding:24px}img{width:150px;height:180px;object-fit:contain}button{padding:16px;background:#5c467c;color:white;border:1px solid #b998e0;border-radius:8px}canvas{background:#24344b;max-width:100%}</style><main><img src="../assets/curator-doyun-sprite.png" alt="도윤 SD 캐릭터"><div><h1>유물 정화 → 조각 복구 → 조사 완료</h1><button id="kill">적 한 마리 정화</button> <button id="inspect" disabled>조사 완료</button> <button id="reset">다시 보기</button><p id="status"></p></div></main><canvas width="1000" height="330"></canvas><script type="module">
import {ExhibitionRenderer} from '../js/render/ExhibitionRenderer.js';
const renderer=new ExhibitionRenderer();renderer.atlas.src='../assets/exhibition-props-transparent.png';renderer.openAtlas.src='../assets/exhibition-open.png';const c=document.querySelector('canvas').getContext('2d');let kills=0,done=false;
function status(){document.querySelector('#status').textContent=`정화 ${kills}/5 · ${done?'복원 완료':kills===5?'조사 가능':'조사 잠김'}`;document.querySelector('#inspect').disabled=kills<5||done;document.querySelector('#kill').disabled=kills===5;}
document.querySelector('#kill').onclick=()=>{kills++;status();};document.querySelector('#inspect').onclick=()=>{done=true;status();};document.querySelector('#reset').onclick=()=>{kills=0;done=false;renderer.assembly.clear();status();};status();
function frame(ms){c.clearRect(0,0,1000,330);for(let i=0;i<6;i++)renderer.cabinet(c,i,90+i*164,200,{width:110,progress:done?1:kills/5*.88,time:ms/1000,key:String(i),label:['옹기','거울','수석','자기','서책','시간 유물'][i],sub:done?'복원 완료':kills===5?'조사로 복원 마무리':'파손 조각 복구 중'});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
