<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#101122"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml"><title>박물관의 황혼 · 여월의 밤</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./mobile.css"><link rel="stylesheet" href="./rpg.css"><link rel="stylesheet" href="./hub.css"><link rel="stylesheet" href="./main-lobby.css"><link rel="stylesheet" href="./viewport.css"><link rel="stylesheet" href="./dialogue.css"></head>
<body><main class="app">
<header class="topbar"><a class="brand" href="#" id="home"><span class="moon">☾</span><span>박물관의 황혼<small>THE NIGHT OF YEOWOL</small></span></a><nav><span id="phase-label">부천시립박물관 · 여월동</span><button id="help" class="quiet">조작 안내 <kbd>H</kbd></button><button id="sound" class="quiet" aria-pressed="false">소리 꺼짐</button></nav></header>
<section id="screen" class="screen" aria-live="polite"></section>
<section id="play" hidden><div class="battle-top"><div><small id="battle-zone"></small><h2 id="battle-title"></h2></div><div class="life"><span id="hpText"></span><div class="bar"><i id="hpBar"></i></div></div><button id="pause" class="quiet">일시정지 <kbd>ESC</kbd></button></div>
<div class="arena"><div class="rpg-battle-tools"><button id="world-map-button" aria-label="탐험 지도">지도 M</button><button id="quest-button" aria-label="의뢰 일지">의뢰 Q</button></div><canvas id="gameCanvas" width="1280" height="720" tabindex="0" aria-label="WASD 이동, J 공격, Z 무기 전환, K 참격, L 폭발, Space 회피, E 상호작용"></canvas><div id="objective" class="objective"></div><div id="boss-hud" class="boss-hud" hidden><span id="boss-name"></span><div class="bar"><i id="bossBar"></i></div></div><div id="interact" class="interact" hidden></div><div class="touch-hud" aria-label="터치 전투 조작"><div class="touch-resonance"><span id="touch-focus-value">공명 50</span><div class="bar"><i id="touch-focus-bar" style="width:50%"></i></div></div><div id="joystick" class="joystick" aria-label="이동 조이스틱"><span class="joy-arrow north">⌃</span><span class="joy-arrow south">⌄</span><span class="joy-arrow west">‹</span><span class="joy-arrow east">›</span><div id="joystick-thumb"></div></div><div class="touch-actions"><button id="touch-attack" class="touch-button attack-button" aria-label="길게 눌러 연속 공격"><span>✧</span><b>공격</b></button><button id="touch-dash" data-touch-action="dash" class="touch-button dash-button" aria-label="회피"><span>»</span><b>회피</b></button><button id="touch-heavy" data-touch-action="heavy" class="touch-button heavy-button" aria-label="초승달 참격"><span>☾</span><b>참격</b></button><button id="touch-nova" data-touch-action="nova" class="touch-button nova-button" aria-label="기억 폭발 공명 50"><span>❋</span><b>폭발</b></button><button id="touch-weapon" data-touch-action="weapon" class="touch-button weapon-button" aria-label="무기 전환"><span>⇄</span><b id="touch-weapon-name">거울빛</b></button></div><div class="touch-utilities"><button id="touch-interact" data-touch-action="interact">◇ 조사</button><button id="touch-potion" data-touch-action="potion">회복 <b id="touch-potion-count">3</b></button></div><div class="touch-relics" aria-label="획득 유물 스킬"><button data-touch-skill="0" aria-label="옹기 호신벽">♨<small>호신벽</small></button><button data-touch-skill="1" aria-label="선사의 쐐기">◇<small>쐐기</small></button><button data-touch-skill="2" aria-label="침묵의 무게">△<small>시간</small></button><button data-touch-skill="3" aria-label="유약의 잔향">❋<small>유약</small></button><button data-touch-skill="4" aria-label="졸업의 증표">▤<small>졸업</small></button></div></div></div>
<div class="combat-deck"><div class="weapon-picker" aria-label="공격 방식 선택"><button data-weapon="0" aria-pressed="true"><b>✧ 거울빛</b><small>연속 사격</small></button><button data-weapon="1" aria-pressed="false"><b>❋ 자기꽃</b><small>부채 산탄</small></button><button data-weapon="2" aria-pressed="false"><b>☾ 월륜</b><small>관통 회귀</small></button></div><div class="weapon-tip"><kbd>Z</kbd><span id="weapon-description"></span></div><div class="focus-meter"><span>공명 <b id="focusText">50 / 100</b></span><div class="bar"><i id="focusBar"></i></div></div></div><div class="battle-bottom"><div class="basic-controls"><span><kbd>WASD</kbd> 이동</span><button data-action="attack"><kbd>J</kbd> 정화</button><button data-action="dash"><kbd>SPACE</kbd> 회피</button><button id="heavy-action" data-action="heavy"><kbd>K</kbd> <span id="heavy-cd">초승달 참격</span></button><button id="nova-action" data-action="nova"><kbd>L</kbd> <span id="nova-cd">기억 폭발 · 50</span></button><button data-action="interact"><kbd>E</kbd> 상호작용</button></div><div id="skillbar" class="skillbar"></div></div><div class="touch-controls"><button data-move="w">↑</button><button data-move="a">←</button><button data-move="s">↓</button><button data-move="d">→</button></div></section>
<footer><span>기억을 잇고, 시간을 복원하는 밤</span><span id="save-status">슬롯 자동 저장 · v5.0</span></footer></main>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status"></div><dialog id="rotate-notice" class="rotate-notice" hidden aria-label="가로 화면 안내"><div class="rotate-device">▯</div><small>YEOWOL · LANDSCAPE MODE</small><h2>달빛을 넓게 펼쳐 주세요</h2><p>기기를 가로로 돌려 주세요.<br>회전하는 동안 게임은 잠시 멈춥니다.</p><button id="rotate-retry" class="primary">전체 화면 · 가로 전환 다시 시도</button><button id="rotate-back" class="quiet">시작 화면으로</button></dialog><div id="room-fade" hidden aria-hidden="true"></div><script type="module" src="./js/main.js"></script></body></html>
